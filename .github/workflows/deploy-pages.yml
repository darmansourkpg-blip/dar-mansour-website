name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can read each article's last-commit date
          # for an accurate JSON-LD dateModified (freshness signal for AI/SEO).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install markdown PyYAML Pillow

      # Regenerate the site from the Python generator + Journal markdown, so
      # articles published via the CMS (which only commit markdown) become
      # real, SEO-optimised HTML pages before deploy.
      - name: Build site
        run: python3 site/build/build.py

      # IndexNow (1/2) — AVANT le déploiement : compare le manifeste d'empreintes
      # de la PRODUCTION à celui du nouveau build, et écrit la liste des URLs
      # ajoutées / modifiées / supprimées. Lire le manifeste distant après le
      # déploiement le comparerait au nouveau manifeste déjà publié (résultat
      # non déterministe selon le CDN) : l'ordre est donc essentiel.
      # Le manifeste écrit ici part avec l'artifact et servira de référence au
      # déploiement suivant.
      - name: IndexNow — compute changed URLs (before deploy)
        continue-on-error: true
        run: python3 site/build/indexnow.py diff --changes "$RUNNER_TEMP/indexnow-changes.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # L'étape de publication Pages échoue parfois de façon transitoire.
      # 1re tentative sans faire échouer le job, puis une nouvelle tentative
      # automatique après une courte pause si nécessaire.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # IndexNow (2/2) — uniquement après un déploiement réussi, donc quand les
      # pages sont réellement en ligne. Soumet la liste calculée plus haut :
      # 0 URL changée = 0 appel. Non bloquant, mais jamais silencieux — un échec
      # produit un warning visible avec les URLs concernées (rattrapage manuel :
      # `indexnow.py diff --force` puis `submit`).
      - name: IndexNow — submit changed URLs (after deploy)
        if: steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success'
        continue-on-error: true
        run: python3 site/build/indexnow.py submit --changes "$RUNNER_TEMP/indexnow-changes.json"
